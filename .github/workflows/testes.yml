name: Testes Python

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Executar teste de rendimento
        working-directory: Bacharelado - Ciência da Computação IMPACTA/2 Semestre/Técnicas de Programação/Aula14 - TDD (Testes unitários)/simular_rendimento
        run: python -m pytest -q
